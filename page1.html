<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock Memory Box ✨</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <div class="app-container">
        <div class="badge">✨ Secret Memory Box</div>
        <h1>Hey Sleepyhead! 🌷</h1>
        <p>Enter your secret teasing nickname to unlock your custom Friendship Day surprise!</p>
        
        <div class="input-group">
            <input type="password" id="passwordInput" placeholder="Enter nickname..." autocomplete="off">
        </div>
        <div id="errorMsg" class="error-msg">
            <i class="fa-solid fa-circle-exclamation"></i> Nope! 😜 Think again... What did I call you most often while teasing you?
        </div>
        
        <button class="btn" onclick="checkPassword()">Unlock Experience <i class="fa-solid fa-sparkles"></i></button>
    </div>

    <script src="script.js"></script>
</body>
</html>
